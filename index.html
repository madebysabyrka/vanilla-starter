<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Starter by Sabyka</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="header container">
      <div class="header-brand">
        <div class="header-logo">Vanilla Starter</div>
        <span class="header-badge">by Sabyrka</span>
      </div>
      <div class="header-actions actions">
        <a
          class="actions-view-on-gh-link button transparent"
          href="https://github.com/madebysabyrka/vanilla-starter"
          target="_blank" rel="noopener noreferrer"
        >
          <img
            class="button-icon"
            src="./icons/github.svg"
            alt="" width="20" height="20"
          />
          <span class="button-label">View on GitHub</span>
        </a>
        <a
          class="actions-use-starter-link button"
          href="https://github.com/madebysabyrka/vanilla-starter/generate"
          target="_blank" rel="noopener noreferrer"
        >
          <span class="button-label">Use this starter</span>
          <img
            class="button-icon"
            src="./icons/arrow-up-right.svg"
            alt="" width="20" height="20"
          />
        </a>
      </div>
    </header>
    <main class="content">
      <section class="hero container">
        <h1 class="hero-title">
          Start simple.<br />
          Build anything.
        </h1>
        <div class="hero-description">
          <p>
            A clean and lightweight starter template for building modern websites with HTML, CSS and
            JavaScript.
          </p>
        </div>
        <div class="hero-actions actions">
          <a
            class="actions-view-on-gh-link button transparent"
            href="https://github.com/madebysabyrka/vanilla-starter"
            target="_blank" rel="noopener noreferrer"
          >
            <img
              class="button-icon"
              src="./icons/github.svg"
              alt="" width="20" height="20"
            />
            <span class="button-label">View on GitHub</span>
          </a>
          <a
            class="actions-use-starter-link button"
            href="https://github.com/madebysabyrka/vanilla-starter/generate"
            target="_blank" rel="noopener noreferrer"
          >
            <span class="button-label">Use this starter</span>
            <img
              class="button-icon"
              src="./icons/arrow-up-right.svg"
              alt="" width="20" height="20"
            />
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
