<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Starter</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="header">
      <a class="header-logo" href="/">
        Vanilla Starter
      </a>
      <div class="header-actions actions">
        <a
          class="actions-view-on-gh-link button transparent"
          href="/" target="_blank"
        >
          View on GitHub
        </a>
        <a
          class="actions-use-starter-link button"
          href="/" target="_blank"
        >
          Use this starter
        </a>
      </div>
    </header>
    <main class="content">
      <section class="hero">
        <h1 class="hero-title">
          Start simple.<br />
          Build anything.
        </h1>
        <div class="hero-description">
          <p>
            A clean and lightweight starter template for building modern websites with HTML, CSS and
            JavaScript.
          </p>
        </div>
        <div class="hero-actions actions">
          <a
            class="actions-use-starter-link button"
            href="/" target="_blank"
          >
            Use this starter
          </a>
          <a
            class="actions-view-on-gh-link button transparent"
            href="/" target="_blank"
          >
            View on GitHub
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
